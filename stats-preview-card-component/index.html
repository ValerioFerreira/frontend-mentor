<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Stats preview card component</title>

</head>

<body>
  <div class="layout">
    
      <div class="content">

        <h1>Get <span class="insights">insights</span> that help your business grow.</h1>

        <h2>Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</h2>

        <div class="stats">

          <div>
            <h3>10k+</h3>
            <p>COMPANIES</p>
          </div>

          <div>
            <h3>314</h3>          
            <p>TEMPLATES</p>
          </div>

          <div>
            <h3>12M+</h3>
            <p>QUERIES</p>
          </div>

        </div>

      </div>

    <div class="image-filter">
        <picture>
          <source
            media="(min-width: 600px)"
            srcset="images/image-header-desktop.jpg"
          />
          <img
            src="images/image-header-mobile.jpg"
            alt="Black and white photo of people working in an office"
          />
        </picture>
    </div>

  </div>
</body>
</html>
